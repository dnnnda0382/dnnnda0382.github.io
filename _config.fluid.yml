# Fluid 主題設定「覆寫檔」
# ------------------------------------------------------------------
# 這個檔案只需要寫「跟主題預設值不同」的項目，Hexo 會把它深層合併(deep merge)
# 到 node_modules/hexo-theme-fluid/_config.yml 之上。
#
# ⚠️ 絕對不要直接改 node_modules/hexo-theme-fluid/ 底下的檔案，
#    那些改動會在下次 npm install 時被覆蓋掉。要調整一律改這裡。
#
# 完整可用選項請參考主題預設檔：node_modules/hexo-theme-fluid/_config.yml
# 官方文件：https://hexo.fluid-dev.com/docs/
# ------------------------------------------------------------------

# 瀏覽器分頁標題分隔符
tab_title_separator: " | "

# 網站圖示（瀏覽器分頁 / 加到 iOS 主畫面時用的圖）
# 圖片放在 source/img/，路徑從網站根目錄算起
favicon: /img/icon.png
apple_touch_icon: /img/icon.png

# 程式碼區塊
code:
  # 顯示語言標籤（右上角顯示 CPP / PYTHON 等）
  language:
    enable: true
    default: "TEXT"

  # 複製按鈕
  copy_btn: true

  highlight:
    enable: true
    line_number: true
    # 使用 prismjs（比 highlight.js 樣式現代）
    # ⚠️ 這個值會強制覆寫根目錄 _config.yml 的 syntax_highlighter，兩邊請保持一致
    lib: "prismjs"
    prismjs:
      style: "default"          # 淺色模式配色
      style_dark: "tomorrow night"  # 深色模式配色
      # true = build 時就把顏色產生好（靜態），前端不需要載 prismjs JS
      preprocess: true

# 深色模式
dark_mode:
  enable: true
  default: auto  # 跟隨系統設定

# 配色
# ------------------------------------------------------------------
# 主題預設是藍灰色系（body #eee、導覽列 #2f4154、連結 #0366d6、hover #30a9de），
# 跟頭圖的紅／橘／深紫夜空對不起來，藍色連結尤其突兀。
#
# 這裡換成從頭圖取樣的色系：
#   洋紅 #b03a50（洋裝）、爆裂橘 #c8442a、深酒紅 #4a2130
#
# 深色模式的所有中性色（底色、卡片、導覽列、分隔線、捲軸）色相統一在 330°，
# 也就是洋紅／酒紅那一側。原本是 268-275°（偏藍的紫），偏冷、跟頭圖搭不起來。
# 轉色相時 L 維持不變，對比才不會跑掉；深色在洋紅色相下彩度感較弱，底色和
# 導覽列各補了 3-4% 的飽和度。
# 底色不直接用飽和色 —— 大面積的紅會很吵而且傷眼，改成「帶玫瑰調的暖中性色」，
# 讓彩度集中在連結、hover 這些小面積的地方。
#
# 所有前景／背景組合都驗算過 WCAG AA（對比 ≥ 4.5:1），最低的是淺色模式的
# 次要文字 4.51。改任何一個顏色之前記得重算，不然會有人讀不到字。
color:
  # 頁面底色 / 卡片底色
  body_bg_color: "#f3ece9"
  body_bg_color_dark: "#21121a"
  board_color: "#fffcfb"
  board_color_dark: "#2c1923"

  # 導覽列
  navbar_bg_color: "#4a2130"
  navbar_bg_color_dark: "#27141e"

  # 內文
  text_color: "#4a3b3f"
  text_color_dark: "#ccc2c7"
  sec_text_color: "#7d666c"
  sec_text_color_dark: "#a2949b"
  post_text_color: "#3b2f33"
  post_text_color_dark: "#ccc2c7"
  post_heading_color: "#2a1e28"
  post_heading_color_dark: "#e8dfe3"

  # 連結（原本是 GitHub 藍 + 天藍 hover，是最不搭的兩個顏色）
  post_link_color: "#b03a50"
  post_link_color_dark: "#e8798c"
  link_hover_color: "#c8442a"
  link_hover_color_dark: "#f08a4b"
  link_hover_bg_color: "#f7ece9"
  link_hover_bg_color_dark: "#3d2531"

  # 分隔線、捲軸、按鈕
  line_color: "#ecdfdb"
  line_color_dark: "#472f3b"
  scrollbar_color: "#c9b3b3"
  scrollbar_color_dark: "#6f5663"
  scrollbar_hover_color: "#a88c8c"
  scrollbar_hover_color_dark: "#8f7381"
  button_hover_bg_color: "#f5e9e6"
  button_hover_bg_color_dark: "#452b38"

# 導覽列
navbar:
  blog_title: "DnDA's Notes"
  menu:
    - { key: "home", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "archive", link: "/archives/", icon: "iconfont icon-archive-fill" }
    - { key: "category", link: "/categories/", icon: "iconfont icon-category-fill" }
    - { key: "tag", link: "/tags/", icon: "iconfont icon-tags-fill" }
    - { key: "about", link: "/about/", icon: "iconfont icon-user-fill" }

# 站內搜尋（Fluid 內建 local search，不需額外裝 plugin）
search:
  enable: true

# 頭圖（各頁面上方的背景圖）
# ------------------------------------------------------------------
# 主題的預設值是自帶的 /img/default.png，每個頁面要各自指定，沒設到的頁面
# 就會留著主題的預設圖，跟首頁對不起來。所以下面每一頁都指定同一張。
# banner_img_height 是佔螢幕高度的百分比，沿用主題預設值。

# 首頁
index:
  slogan:
    enable: true
    text: "挽留不想失去的記憶碎片"
  banner_img: /img/cover.jpg

# 文章頁
post:
  banner_img: /img/cover.jpg

  meta:
    # 預估閱讀時間 —— 關掉，文章頁只留字數統計
    min2read:
      enable: false

    # 字數統計
    # ------------------------------------------------------------------
    # 「字數」實際上是去掉 HTML 標籤和空白後的「字元數」
    # （見 node_modules/hexo-theme-fluid/scripts/helpers/wordcount.js），
    # 計算前會先由 scripts/wordcount-skip-katex.js 扣掉 KaTeX 的 MathML 分身。
    wordcount:
      enable: true

  # 數學公式
  # ------------------------------------------------------------------
  # 這裡設 katex 只會載入 KaTeX 的「CSS」，不會載入 auto-render JS。
  # 公式實際上是由 hexo-renderer-markdown-it + @renbaoshuo/markdown-it-katex
  # 在 build 階段就渲染成 HTML 的，所以兩者互補、不會重複渲染。
  math:
    enable: true
    specific: false  # false = 所有文章都可直接寫公式，不用在 front-matter 加 math: true
    engine: katex

  # 目錄（TOC）
  toc:
    enable: true
    placement: right
    expand_all: true
    headingSelector: "h1,h2,h3,h4,h5,h6"
    collapseDepth: 0

  # 文章底部版權宣告
  copyright:
    enable: false

# 歸檔頁
archive:
  banner_img: /img/cover.jpg

# 分類頁
category:
  banner_img: /img/cover.jpg

# 標籤頁
tag:
  banner_img: /img/cover.jpg

  # 標籤雲：主題預設是 #BBBBEE → #337ab7 兩個藍色，跟全站色系不搭，而且淺的
  # 那端在白底上幾乎看不見（對比只有 1.9:1）。換成橘→紅。
  #
  # ⚠️ 這裡的顏色是 build 時就寫死進 inline style 的（見產出的 <a style="color:...">），
  #    淺色和深色模式共用同一組值，所以每個顏色都必須在兩種底色上都看得清楚。
  #    算過了：不可能兩邊都到 4.5:1（白底要求 L≤0.179、深底要求 L≥0.236，互相
  #    矛盾），所以目標訂在兩邊都 ≥ 3:1，也就是大字級距的 AA。
  #    可行的亮度區間是 L ∈ [0.141, 0.293]，下面兩個端點都在裡面。
  #    連結用的洋紅 #b03a50 刻意沒用 —— 它在深色底只有 2.81:1。
  tagcloud:
    start_color: "#d9683c"   # 文章少的標籤：橘（白底 3.43 / 深底 4.72）
    end_color: "#c04038"     # 文章多的標籤：紅（白底 5.10 / 深底 3.17）

# 關於頁
# ------------------------------------------------------------------
# ⚠️ 頭像下面那幾行字是設定值，不在 source/about/index.md 裡。
#    關於頁由上到下的順序是：
#      avatar（圓形頭像）→ name（大字）→ intro（小字）→ icons（一排圖示）
#      → 最後才是 source/about/index.md 的正文
about:
  banner_img: /img/cover.jpg

  # 頭像，CSS 會裁成圓形（object-fit: cover，取正中央的正方形）
  avatar: /img/avatar.jpg

  # 頭像正下方的大字
  name: "DnDA"

  # 大字下面那行小字。留空就不顯示，想寫什麼直接填在引號裡。
  intro: "還在尋找能讓我沉醉一輩子的事物"

  # 小字下面那排圖示
  # class 是圖示名稱，完整清單見 https://hexo.fluid-dev.com/docs/icon/
  # （實際來源是 iconfont 設定的那份 CDN CSS，裡面每個 .icon-xxx 都可以用）
  # tip 是滑鼠移上去顯示的說明；link 會開新分頁
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/dnnnda0382", tip: "GitHub" }
    - { class: "iconfont icon-mail", link: "mailto:dnnnda0382@gmail.com", tip: "Email" }
    # Discord：圖示有（icon-discord-fill），但 link 一定要是可以點的網址。
    # 把下面那行的 # 拿掉，並二選一填進去：
    #   伺服器邀請  https://discord.gg/xxxxxxx
    #   個人檔案    https://discord.com/users/<你的 18-19 位數字 user ID>
    #              （Discord 設定 → 進階 → 開啟開發者模式，再對自己頭像按右鍵複製使用者 ID）
    # 只想顯示帳號名稱、不想連出去的話，這個主題做不到 —— 圖示一定是超連結。
    - { class: "iconfont icon-discord-fill", link: "https://discord.com/users/762289288720285746", tip: "Discord" }

# 分享預覽（Open Graph）
# ------------------------------------------------------------------
# 貼連結到 Discord / LINE / Twitter 時顯示的那張卡片。
#
# 不設 image 的話，Hexo 的 open_graph helper 會去掃文章內容裡的 <img>，把找到的
# 每一張都塞成 og:image（見 node_modules/hexo/dist/plugins/helper/open_graph.js
# 第 77 行）。結果是：
#   - 首頁沒有任何圖片 → 完全沒有 og:image，卡片變成光禿禿的純文字
#   - 匯入的文章 → 抓到一堆 hackmd.io/_uploads/... 的外部網址，HackMD 那邊
#     的圖被刪掉預覽就壞了
#
# 設了之後 images 陣列非空，那段掃描就不會執行。填相對路徑即可，helper 會用
# new URL(path, config.url) 補成絕對網址。
#
# ⚠️ Fluid 是用 Object.assign({ image: page.og_img || page.index_img }, theme.open_graph)
#    合併的（layout/_partials/head.ejs），theme 設定在後面會蓋掉 page 的值。
#    所以這裡一設，全站每一頁都用同一張圖，個別文章的 index_img 會失效。
#    之後如果想讓某篇文章用自己的預覽圖，得把這行拿掉、改成每篇設 index_img。
open_graph:
  image: /img/cover.jpg

# 交換連結頁
# ------------------------------------------------------------------
# 主題預設 links.enable 是 true，會在 /links/ 產生一個「交換連結」頁面。
# 那頁沒有被導覽列連到，但網址仍然公開可達，而且內容全是主題的預設值：
#   - 印著 hexo.fluid-dev.com（主題作者的部落格）
#   - 頭圖用主題自帶的 /img/default.png，跟全站的 cover.jpg 對不起來
#   - 引用了 /img/favicon.png，那個檔案在這個站不存在（唯一的死連結）
# 沒有要交換友鏈就關掉。之後想做的話把這行改回 true 再設定 links.items。
links:
  enable: false

# 頁尾
# ------------------------------------------------------------------
# 主題預設會放一行「Hexo ❤ Fluid」的推廣連結，設成空字串就不顯示。
# 這是主題作者的請求（設定檔註解寫「建議保留」），不是授權條款的要求 ——
# Fluid 是 GPL-3，要求的是散布時保留原始碼裡的授權與著作權聲明，那份
# LICENSE 檔還原封不動待在 node_modules/hexo-theme-fluid/ 裡。
#
# 想放自己的東西的話，這個欄位吃的是原始 HTML，例如：
#   content: '<span>© 2026 DnDA</span>'
footer:
  content: ""

# 自訂樣式覆寫（路徑相對於 source/ 目錄）
# 要調整外觀請改 source/css/custom.css，不要動 node_modules 裡的主題原始檔
custom_css:
  - /css/custom.css

# 靜態資源 CDN
static_prefix:
  # ⚠️ KaTeX 的 CSS 版本必須和 package.json 裡 katex 的版本完全一致，
  #    否則字型 metrics 對不上、公式會排版錯位。
  #    改 katex 版本時，這裡的網址也要一起改。
  katex: https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/
