# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: DnDA's Notes
subtitle: '筆記與雜記'
description: '數學、程式與學習筆記'
keywords:
author: DnDA
language: zh-TW
timezone: Asia/Taipei

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
## repo 名稱為 dnnnda0382.github.io，網站掛在網域根目錄，所以 root 維持 /
url: https://dnnnda0382.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
## 程式碼高亮：使用 prismjs（build 時就上色，前端不需額外 JS）
## 注意：Fluid 主題會以 _config.fluid.yml 的 code.highlight.lib 強制覆寫這裡的設定，
##      兩邊請保持一致，改的時候兩個檔案一起改。
syntax_highlighter: prismjs
highlight:
  enable: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Markdown 渲染器 hexo-renderer-markdown-it
markdown:
  preset: 'default'
  render:
    html: true
    xhtmlOut: false
    langPrefix: 'language-'
    breaks: true       # 單一換行即斷行，行為與 HackMD 一致
    linkify: true
    typographer: false # 關閉智慧標點，避免 -- (c) "" 等在技術文章中被改寫
  enable_rules:
  disable_rules:
  plugins:
    - '@renbaoshuo/markdown-it-katex' # LaTeX：$...$ 行內、$$...$$ 區塊
  anchors:
    level: 1           # 為 h1~h6 產生 id，目錄(TOC)才抓得到
    collisionSuffix: ''
    permalink: false   # 錨點圖示交給 Fluid 的 anchorjs
    case: 0
    separator: '-'

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
## 主題以 npm 安裝（hexo-theme-fluid），設定覆寫寫在根目錄 _config.fluid.yml
theme: fluid

# Deployment
## 部署由 GitHub Actions 處理（.github/workflows/deploy.yml），不使用 hexo deploy。
## 請勿在此設定 deploy，避免和 CI 流程分歧。
