# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
# ------------------------------------------------------------------
# 站台基本資訊。改這一段之前先看清楚每個欄位實際用在哪裡 —— 有些會出現在
# 分享連結的預覽卡片上，有些其實根本沒被用到。

# 瀏覽器分頁標題、分享卡片的標題。
# 導覽列左上角雖然被手寫 logo 圖蓋掉了（見 source/css/custom.css），
# 但那個 <strong> 裡的文字仍然是這個值，螢幕閱讀器和搜尋引擎讀的是它。
title: DnDA's Notes

# 用在兩個地方：
#
# 1. RSS 訂閱來源的說明文字。hexo-generator-feed 取的是
#    config.subtitle || config.description（見該套件 lib/generator.js 第 33 行），
#    subtitle 有值就輪不到下面的 description，所以 RSS 上顯示的是這一行。
#
# 2. 首頁大標下方的副標，但這個用途目前輪不到 —— 它只是 _config.fluid.yml 裡
#    index.slogan.text 的備援值（見 hexo-theme-fluid/layout/index.ejs 第 3 行），
#    而 slogan 已經設了「人會離去，但故事會留下」。把 slogan 關掉這裡才會生效。
subtitle: '筆記與雜記'

# 首頁的分享預覽說明文字（<meta name="description"> 和 og:description）。
# 貼首頁連結到 Discord / LINE 時，卡片上顯示的就是這一句。
# 個別文章不吃這個值，走各自 front-matter 的 description（見 CLAUDE.md）。
description: "DnDA's blog"

# 產生 <meta name="keywords">。留空即可 —— Google 從 2009 年就宣告不採用
# 這個欄位做排名了，填了也沒有效果。
keywords:

# <meta name="author">
author: DnDA

# 影響日期顯示格式和 og:locale，別改。
language: zh-TW
timezone: Asia/Taipei

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
## repo 名稱為 dnnnda0382.github.io，網站掛在網域根目錄，所以 root 維持 /
url: https://dnnnda0382.github.io
root: /
# 文章網址的格式。
# ⚠️ 改這個會讓「全站既有連結」一次失效，除非確定沒人連過，否則別動。
#    其中 :title 取自「檔名」，不是 front-matter 的 title —— 所以改標題不會
#    動到網址，改檔名或 date 才會。
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  # false = 產生的連結不帶 index.html。純粹是好看，檔案本身還是 index.html，
  # GitHub Pages 收到 /foo/ 一樣會回 /foo/index.html，舊連結不會壞。
  # 主要是讓 og:url 和 canonical 不要出現 .../index.html 這種尾巴。
  trailing_index: false
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
## 程式碼高亮：使用 prismjs（build 時就上色，前端不需額外 JS）
## 注意：Fluid 主題會以 _config.fluid.yml 的 code.highlight.lib 強制覆寫這裡的設定，
##      兩邊請保持一致，改的時候兩個檔案一起改。
syntax_highlighter: prismjs
highlight:
  enable: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Markdown 渲染器 hexo-renderer-markdown-it
markdown:
  preset: 'default'
  render:
    html: true
    xhtmlOut: false
    langPrefix: 'language-'
    breaks: true       # 單一換行即斷行，行為與 HackMD 一致
    linkify: true
    typographer: false # 關閉智慧標點，避免 -- (c) "" 等在技術文章中被改寫
  enable_rules:
  disable_rules:
  plugins:
    - '@renbaoshuo/markdown-it-katex' # LaTeX：$...$ 行內、$$...$$ 區塊
  anchors:
    level: 1           # 為 h1~h6 產生 id，目錄(TOC)才抓得到
    collisionSuffix: ''
    permalink: false   # 錨點圖示交給 Fluid 的 anchorjs
    case: 0
    separator: '-'

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
## 用 'date'：更新時間永遠等於發布時間。
##
## 不用預設的 'mtime'（檔案修改時間），因為在 CI 上那個值是錯的 ——
## GitHub Actions 每次 build 都重新 git clone，clone 出來的檔案 mtime 是
## clone 當下的時間，所以線上版每篇文章的「更新時間」都會變成「最近一次
## 部署的時間」，等於假資訊。本機也一樣敏感：改個錯字、甚至只是重新存檔
## 就會跳動。
##
## 目前這個值只影響 <meta property="article:modified_time">，
## Fluid 的 post.updated.enable 預設是 false，頁面上不顯示更新時間。
## 某篇真的有實質改版時，在該篇 front-matter 手動加 updated: 即可，
## 那個優先權高於這裡的自動推算。
updated_option: 'date'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# RSS 訂閱來源
# ------------------------------------------------------------------
# 由 hexo-generator-feed 產生 /atom.xml。讀者可以用 RSS 閱讀器訂閱更新。
# autodiscovery 會在每頁的 <head> 插入 <link rel="alternate">，閱讀器貼網站
# 首頁網址就能自動找到訂閱來源，不用手動給 atom.xml 的路徑。
#
# 內文用 content: false（只放摘要不放全文）。摘要的取用順序是
# post.description → post.excerpt → 內文前 content_limit 字
# （見 node_modules/hexo-generator-feed/lib/generator.js 第 54 行），
# 每篇都有填 description，所以實際上就是各自的 description。
feed:
  type: atom
  path: atom.xml
  limit: 20
  content: false
  content_limit: 140
  order_by: -date
  icon: /img/icon.png
  autodiscovery: true

# sitemap
# ------------------------------------------------------------------
# 由 hexo-generator-sitemap 產生 /sitemap.xml，給搜尋引擎索引用。
# 標籤頁和分類頁不收錄 —— 它們只是同一批文章的不同排列，收進去對搜尋引擎
# 來說是重複內容，沒有好處。
sitemap:
  path: sitemap.xml
  rel: false
  tags: false
  categories: false

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
## 主題以 npm 安裝（hexo-theme-fluid），設定覆寫寫在根目錄 _config.fluid.yml
theme: fluid

# Deployment
## 部署由 GitHub Actions 處理（.github/workflows/deploy.yml），不使用 hexo deploy。
## 請勿在此設定 deploy，避免和 CI 流程分歧。
